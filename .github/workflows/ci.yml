name: corpus integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  integrity:
    name: declared = realized
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate the corpus (README declaration vs papers/ reality)
        run: python3 tools/corpus_integrity.py
